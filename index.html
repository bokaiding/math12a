<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Math Solver</title>
    
    <!-- Fonts: Inter for clean, modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tesseract.js for Client-Side OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        /* 
         * CSS VARIABLES & RESET 
         * Ultra-minimalist palette
         */
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #212529;
            --text-muted: #6c757d;
            --border-color: #e9ecef;
            --accent-color: #212529;
            --accent-hover: #495057;
            --error-color: #dc3545;
            --success-color: #198754;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.02);
            --shadow-md: 0 8px 16px rgba(0,0,0,0.04);
            --radius: 12px;
            --font-family: 'Inter', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 
         * LAYOUT & CARD 
         */
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            transition: transform 0.3s ease;
        }

        h1 {
            font-weight: 600;
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        /* 
         * INPUTS & CONTROLS 
         */
        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        /* API Key Input Styling */
        .api-key-wrapper {
            position: relative;
            margin-bottom: 25px;
            background: #fafafa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        input[type="text"], 
        textarea {
            width: 100%;
            padding: 12px 16px;
            font-family: var(--font-family);
            font-size: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: #fff;
            color: var(--text-main);
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        input[type="text"]:focus, 
        textarea:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(33, 37, 41, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* File Upload Styling */
        .file-upload {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .file-upload:hover {
            border-color: var(--accent-color);
            background-color: #fafafa;
            color: var(--text-main);
        }

        .file-upload input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .file-name {
            margin-top: 8px;
            font-size: 0.85rem;
            color: var(--text-main);
            font-weight: 500;
            display: none;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            font-family: var(--font-family);
            font-size: 0.95rem;
            font-weight: 500;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #fff;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: #f8f9fa;
            border-color: #dee2e6;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        /* 
         * RESULTS & FEEDBACK 
         */
        .result-area {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid var(--border-color);
            display: none; /* Hidden by default */
            animation: fadeIn 0.4s ease;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .result-title {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .solution-content {
            background: #fafafa;
            padding: 20px;
            border-radius: 8px;
            font-size: 0.95rem;
            white-space: pre-wrap; /* Preserve formatting from API */
            color: #333;
            line-height: 1.7;
        }

        .error-msg {
            color: var(--error-color);
            font-size: 0.9rem;
            margin-top: 10px;
            display: none;
            text-align: center;
        }

        /* Loading Spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s linear infinite;
            display: none;
        }

        .ocr-status {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: 10px;
            min-height: 20px;
        }

        /* Animations */
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Responsive */
        @media (max-width: 480px) {
            .container { padding: 25px; }
            .btn-group { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Math Solver</h1>
        <p class="subtitle">Powered by Wolfram Alpha & Tesseract OCR</p>

        <!-- API Key Section -->
        <div class="api-key-wrapper">
            <label for="apiKey">Wolfram Alpha App ID</label>
            <input type="text" id="apiKey" placeholder="Paste your App ID here (e.g., 2X4Y6Z...)" autocomplete="off">
            <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 5px;">
                Don't have one? <a href="https://developer.wolframalpha.com/" target="_blank" style="color: var(--accent-color);">Get a free key</a>.
            </div>
        </div>

        <!-- Text Input -->
        <div class="input-group">
            <label for="mathInput">Problem</label>
            <textarea id="mathInput" placeholder="Type a math problem (e.g., solve x^2 - 4x + 4 = 0) or upload an image below..."></textarea>
        </div>

        <!-- Image Upload -->
        <div class="input-group">
            <label>Or upload an image</label>
            <div class="file-upload" id="dropZone">
                <input type="file" id="imageInput" accept="image/*">
                <span id="uploadText">Click or drag image here</span>
            </div>
            <div class="file-name" id="fileName"></div>
            <div class="ocr-status" id="ocrStatus"></div>
        </div>

        <!-- Controls -->
        <div class="btn-group">
            <button class="btn-secondary" id="clearBtn">Clear</button>
            <button class="btn-primary" id="solveBtn">
                <span class="btn-text">Solve</span>
                <div class="spinner" id="loadingSpinner"></div>
            </button>
        </div>

        <!-- Error Display -->
        <div class="error-msg" id="errorMsg"></div>

        <!-- Results -->
        <div class="result-area" id="resultArea">
            <div class="result-header">
                <span class="result-title">Solution</span>
                <button class="btn-secondary" id="copyBtn" style="padding: 6px 12px; font-size: 0.8rem; flex: none;">Copy</button>
            </div>
            <div class="solution-content" id="solutionContent"></div>
        </div>
    </div>

    <script>
        /**
         * MATH SOLVER LOGIC
         * Modular structure for clarity and maintenance.
         */

        // --- DOM Elements ---
        const els = {
            apiKey: document.getElementById('apiKey'),
            input: document.getElementById('mathInput'),
            imageInput: document.getElementById('imageInput'),
            fileName: document.getElementById('fileName'),
            uploadText: document.getElementById('uploadText'),
            ocrStatus: document.getElementById('ocrStatus'),
            solveBtn: document.getElementById('solveBtn'),
            clearBtn: document.getElementById('clearBtn'),
            copyBtn: document.getElementById('copyBtn'),
            spinner: document.getElementById('loadingSpinner'),
            btnText: document.querySelector('.btn-text'),
            errorMsg: document.getElementById('errorMsg'),
            resultArea: document.getElementById('resultArea'),
            solutionContent: document.getElementById('solutionContent')
        };

        // --- State Management ---
        let isProcessing = false;

        // --- Initialization ---
        function init() {
            // Load API Key from localStorage if available
            const savedKey = localStorage.getItem('wolframApiKey');
            if (savedKey) els.apiKey.value = savedKey;

            // Event Listeners
            els.solveBtn.addEventListener('click', handleSolve);
            els.clearBtn.addEventListener('click', handleClear);
            els.copyBtn.addEventListener('click', handleCopy);
            
            els.imageInput.addEventListener('change', handleImageUpload);
            
            // Save API Key on change
            els.apiKey.addEventListener('input', (e) => {
                localStorage.setItem('wolframApiKey', e.target.value.trim());
            });
        }

        // --- Core Logic: Handle Solve ---
        async function handleSolve() {
            const apiKey = els.apiKey.value.trim();
            const query = els.input.value.trim();

            // Validation
            if (!apiKey) {
                showError("Please enter your Wolfram Alpha App ID.");
                return;
            }
            if (!query) {
                showError("Please enter a problem or upload an image first.");
                return;
            }

            setLoading(true);
            hideError();
            els.resultArea.style.display = 'none';

            try {
                const solution = await fetchWolframAlpha(apiKey, query);
                displayResult(solution);
            } catch (err) {
                showError(err.message);
            } finally {
                setLoading(false);
            }
        }

        // --- Core Logic: Handle Image Upload & OCR ---
        async function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            // UI Updates
            els.fileName.textContent = file.name;
            els.fileName.style.display = 'block';
            els.uploadText.textContent = "Image selected";
            els.input.value = ""; // Clear text input to avoid confusion
            hideError();
            els.resultArea.style.display = 'none';

            // Run Tesseract OCR
            els.ocrStatus.textContent = "Extracting text from image...";
            
            try {
                const { data: { text } } = await Tesseract.recognize(
                    file,
                    'eng',
                    { logger: m => {
                        if(m.status === 'recognizing text') {
                            els.ocrStatus.textContent = `OCR Progress: ${Math.round(m.progress * 100)}%`;
                        }
                    }}
                );

                const cleanedText = text.trim();
                
                if (!cleanedText) {
                    throw new Error("No text detected in image. Please try a clearer photo.");
                }

                els.input.value = cleanedText;
                els.ocrStatus.textContent = "Text extracted successfully! Click 'Solve'.";
                
                // Auto-submit option could go here, but we'll let user verify first
                // handleSolve(); 

            } catch (err) {
                els.ocrStatus.textContent = "";
                showError(`OCR Error: ${err.message}`);
            }
        }

        // --- API Integration: Wolfram Alpha ---
        async function fetchWolframAlpha(appId, query) {
            // Construct URL for Short Answers or Full Results
            // Using 'plaintext' output for step-by-step text where available
            const baseUrl = "https://api.wolframalpha.com/v2/query";
            const params = new URLSearchParams({
                input: query,
                appid: appId,
                output: "json",
                pods: "true",
                podstate: "Result__Step-by-step solution", // Request step-by-step if available
                format: "plaintext"
            });

            const response = await fetch(`${baseUrl}?${params}`);
            
            if (!response.ok) {
                throw new Error("Network error. Please check your connection.");
            }

            const data = await response.json();

            // Handle API Errors
            if (data.errorcode) {
                if (data.errorcode === 1) throw new Error("Invalid App ID.");
                if (data.errorcode === 5) throw new Error("API Limit Reached.");
                throw new Error(`Wolfram Error: ${data.errormsg}`);
            }

            if (data.queryresult.success === false) {
                throw new Error("Could not understand the problem. Try rephrasing or checking the image.");
            }

            // Parse Result
            // We look for 'Steps' pod first, then 'Result', then 'Input'
            let solutionText = "";
            const pods = data.queryresult.pods;

            // 1. Try to find Step-by-Step Solution
            const stepsPod = pods.find(p => p.title.toLowerCase().includes('step') || p.id === 'steps');
            if (stepsPod && stepsPod.subpods) {
                stepsPod.subpods.forEach(sub => {
                    if(sub.plaintext) solutionText += sub.plaintext + "\n\n";
                });
            }

            // 2. If no steps, get the main Result
            if (!solutionText) {
                const resultPod = pods.find(p => p.title === 'Result' || p.id === 'result');
                if (resultPod && resultPod.subpods) {
                    resultPod.subpods.forEach(sub => {
                        if(sub.plaintext) solutionText += sub.plaintext + "\n";
                    });
                }
            }

            // 3. Fallback: Concatenate all relevant pods if specific ones missing
            if (!solutionText) {
                pods.forEach(pod => {
                    if (pod.primary || pod.title === 'Input' || pod.title === 'Result') {
                        pod.subpods?.forEach(sub => {
                            if (sub.plaintext) solutionText += `${pod.title}: ${sub.plaintext}\n`;
                        });
                    }
                });
            }

            if (!solutionText) {
                return "Solution found, but no text representation is available for this specific query type.";
            }

            return solutionText;
        }

        // --- UI Helpers ---
        function setLoading(isLoading) {
            isProcessing = isLoading;
            if (isLoading) {
                els.spinner.style.display = 'block';
                els.btnText.textContent = 'Solving...';
                els.solveBtn.disabled = true;
                els.clearBtn.disabled = true;
                els.imageInput.disabled = true;
            } else {
                els.spinner.style.display = 'none';
                els.btnText.textContent = 'Solve';
                els.solveBtn.disabled = false;
                els.clearBtn.disabled = false;
                els.imageInput.disabled = false;
            }
        }

        function displayResult(text) {
            els.solutionContent.textContent = text;
            els.resultArea.style.display = 'block';
            // Scroll to result on mobile
            els.resultArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function showError(msg) {
            els.errorMsg.textContent = msg;
            els.errorMsg.style.display = 'block';
            els.resultArea.style.display = 'none';
        }

        function hideError() {
            els.errorMsg.style.display = 'none';
        }

        function handleClear() {
            els.input.value = '';
            els.imageInput.value = '';
            els.fileName.style.display = 'none';
            els.fileName.textContent = '';
            els.uploadText.textContent = "Click or drag image here";
            els.ocrStatus.textContent = '';
            els.resultArea.style.display = 'none';
            hideError();
            els.input.focus();
        }

        async function handleCopy() {
            const text = els.solutionContent.textContent;
            try {
                await navigator.clipboard.writeText(text);
                const originalText = els.copyBtn.textContent;
                els.copyBtn.textContent = "Copied!";
                setTimeout(() => els.copyBtn.textContent = originalText, 2000);
            } catch (err) {
                console.error('Failed to copy', err);
            }
        }

        // Start the app
        init();

    </script>
</body>
</html>
