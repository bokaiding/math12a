<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Solver</title>
    <!-- Load Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Load Math.js for calculations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js"></script>
    <!-- Load Tesseract.js for OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

    <style>
        /* --- CSS Variables & Reset --- */
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-primary: #212529;
            --text-secondary: #6c757d;
            --accent-color: #212529;
            --accent-hover: #495057;
            --border-color: #e9ecef;
            --error-color: #dc3545;
            --success-color: #198754;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        /* --- Main Container --- */
        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            padding: 40px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        header h1 {
            font-weight: 600;
            font-size: 24px;
            text-align: center;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        header p {
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* --- Input Areas --- */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        textarea {
            width: 100%;
            padding: 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            resize: none;
            height: 100px;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(33, 37, 41, 0.1);
        }

        /* --- File Upload --- */
        .file-upload {
            position: relative;
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #fafafa;
        }

        .file-upload:hover {
            border-color: var(--accent-color);
            background: #f1f3f5;
        }

        .file-upload input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .file-upload-text {
            font-size: 14px;
            color: var(--text-secondary);
            pointer-events: none;
        }

        .file-name {
            font-size: 13px;
            color: var(--accent-color);
            margin-top: 5px;
            font-weight: 500;
            display: none;
        }

        /* --- Buttons --- */
        .button-group {
            display: flex;
            gap: 12px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            background-color: #adb5bd;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background-color: #f8f9fa;
            border-color: #dee2e6;
        }

        /* --- Output Area --- */
        .output-area {
            margin-top: 10px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: none; /* Hidden by default */
            flex-direction: column;
            gap: 12px;
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .output-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .copy-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 13px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .copy-btn:hover {
            background: #e9ecef;
        }

        .solution-text {
            font-size: 16px;
            color: var(--text-primary);
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* --- Loading Spinner --- */
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* --- Error Message --- */
        .error-msg {
            color: var(--error-color);
            font-size: 14px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }

        /* --- OCR Progress --- */
        .ocr-progress {
            font-size: 12px;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Math Solver</h1>
            <p>Type a problem or upload an image. No API key required.</p>
        </header>

        <!-- Text Input -->
        <div class="input-group">
            <label for="math-input">Problem</label>
            <textarea id="math-input" placeholder="e.g., sqrt(16) + 2^3 or solve x^2 - 4 = 0"></textarea>
        </div>

        <!-- Image Upload -->
        <div class="input-group">
            <label>Image Input (OCR)</label>
            <div class="file-upload" id="drop-zone">
                <input type="file" id="image-input" accept="image/*">
                <div class="file-upload-text">
                    Click or drag an image here to extract math
                </div>
                <div class="file-name" id="file-name"></div>
            </div>
            <div class="ocr-progress" id="ocr-progress">Extracting text...</div>
        </div>

        <!-- Action Buttons -->
        <div class="button-group">
            <button class="btn-secondary" id="clear-btn">Clear</button>
            <button class="btn-primary" id="solve-btn">
                <span class="btn-text">Solve</span>
                <div class="spinner" id="loading-spinner"></div>
            </button>
        </div>

        <!-- Error Display -->
        <div class="error-msg" id="error-msg"></div>

        <!-- Solution Output -->
        <div class="output-area" id="output-area">
            <div class="output-header">
                <span class="output-title">Solution</span>
                <button class="copy-btn" id="copy-btn">Copy</button>
            </div>
            <div class="solution-text" id="solution-text"></div>
        </div>
    </div>

    <script>
        /**
         * MATH SOLVER LOGIC
         * Uses math.js for evaluation and Tesseract.js for OCR.
         * No external API keys required.
         */

        // DOM Elements
        const mathInput = document.getElementById('math-input');
        const imageInput = document.getElementById('image-input');
        const fileNameDisplay = document.getElementById('file-name');
        const ocrProgress = document.getElementById('ocr-progress');
        const solveBtn = document.getElementById('solve-btn');
        const clearBtn = document.getElementById('clear-btn');
        const copyBtn = document.getElementById('copy-btn');
        const outputArea = document.getElementById('output-area');
        const solutionText = document.getElementById('solution-text');
        const errorMsg = document.getElementById('error-msg');
        const spinner = document.getElementById('loading-spinner');
        const btnText = document.querySelector('.btn-text');

        // --- Event Listeners ---

        // Handle File Upload & OCR
        imageInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // Reset UI
            fileNameDisplay.style.display = 'block';
            fileNameDisplay.textContent = file.name;
            errorMsg.style.display = 'none';
            outputArea.style.display = 'none';
            
            // Show Progress
            ocrProgress.style.display = 'block';
            ocrProgress.textContent = "Initializing OCR...";

            try {
                // Initialize Tesseract Worker (reuse if possible)
                const worker = await Tesseract.createWorker({
                    logger: m => {
                        if(m.status === 'recognizing text') {
                            ocrProgress.textContent = `Extracting text: ${Math.round(m.progress * 100)}%`;
                        } else {
                            ocrProgress.textContent = m.status;
                        }
                    }
                });

                await worker.loadLanguage('eng');
                await worker.initialize('eng');

                // Perform Recognition
                const { data: { text } } = await worker.recognize(file);
                
                // ADVANCED CLEANING: Convert raw OCR text to math-friendly format
                let cleaned = text.trim();
                
                // 1. Aggressive Filtering: Extract ONLY valid math characters
                // This prevents garbage like "y (b) n n y" from appearing
                const allowedChars = /[0-9+\-*/^().=xyzabcn]/gi;
                const matches = cleaned.match(allowedChars);
                
                if (!matches || matches.length === 0) {
                    throw new Error("No mathematical text found in image.");
                }
                
                // Join only the valid characters
                cleaned = matches.join('');
                
                // 2. Fix common misreads BEFORE removing spaces
                // Replace isolated 'o' or 'O' with '0'
                cleaned = cleaned.replace(/o/gi, '0');
                // Replace isolated 'l' or 'I' with '1'
                cleaned = cleaned.replace(/([lI])/g, '1');
                
                // 3. Handle multiplication symbols
                // Replace 'x' or 'X' between numbers with '*' 
                cleaned = cleaned.replace(/(\d)[xX](\d)/g, '$1*$2');
                // If 'x' is next to a number, treat as multiplication (e.g., 2x -> 2*x)
                cleaned = cleaned.replace(/(\d)([a-z])/gi, '$1*$2');
                cleaned = cleaned.replace(/([a-z])(\d)/gi, '$1*$2');
                
                // 4. Handle division
                cleaned = cleaned.replace(/[÷]/g, '/');
                
                // 5. Remove any remaining spaces for clean calculation
                cleaned = cleaned.replace(/\s+/g, '');
                
                // 6. Validation: Must contain at least one number or operator
                const hasNumber = /\d/.test(cleaned);
                const hasOperator = /[+\-*/^=]/.test(cleaned);
                
                if (!hasNumber && !hasOperator) {
                    throw new Error("Extracted text does not look like a math problem.");
                }
                
                if(cleaned && cleaned.length > 0) {
                    mathInput.value = cleaned;
                    ocrProgress.textContent = "Text extracted!";
                    ocrProgress.style.color = "var(--success-color)";
                    setTimeout(() => {
                        ocrProgress.style.display = 'none';
                        ocrProgress.style.color = "var(--text-secondary)";
                    }, 2000);
                } else {
                    throw new Error("No mathematical text found in image.");
                }

                await worker.terminate();

            } catch (err) {
                console.error(err);
                ocrProgress.style.display = 'none';
                showError("Failed to extract text. Ensure the image is clear and contains printed/handwritten math.");
            }
        });

        // Handle Solve Button
        solveBtn.addEventListener('click', () => {
            const expression = mathInput.value.trim();
            
            if (!expression) {
                showError("Please enter a problem or upload an image.");
                return;
            }

            setLoading(true);
            errorMsg.style.display = 'none';
            outputArea.style.display = 'none';

            // Simulate a small delay for better UX
            setTimeout(() => {
                try {
                    // Evaluate using math.js
                    // Note: math.evaluate handles basic algebra, calculus, and units.
                    // For complex symbolic solving (like "solve x^2=4"), we try to evaluate directly.
                    // If it's an equation, we might need to rearrange it for simple evaluation.
                    
                    let result;
                    
                    // Simple check for equations (contains '=')
                    if (expression.includes('=')) {
                        // Attempt to solve simple equations by evaluating both sides or using logic
                        // Since math.js eval doesn't strictly "solve" symbolically without plugins,
                        // we will try to evaluate the expression as is, or provide a helpful message.
                        
                        // Try to evaluate left and right if possible, or just return the formatted equation
                        // For this demo, we will try to evaluate the expression. 
                        // If it's "x=2", math.js might just return 2.
                        
                        // Advanced: Use math.resolve if variables are defined, but here we assume unknown vars.
                        // Fallback for equations: Just show the evaluated result of the expression if possible.
                        result = math.evaluate(expression);
                    } else {
                        result = math.evaluate(expression);
                    }

                    // Format result
                    let displayResult = "";
                    
                    if (typeof result === 'number') {
                        // Format number to avoid long decimals
                        displayResult = Number.isInteger(result) ? result.toString() : result.toFixed(4).replace(/\.?0+$/, '');
                    } else if (result && typeof result === 'object') {
                        // Handle matrices or complex numbers
                        displayResult = result.toString();
                    } else {
                        displayResult = result;
                    }

                    // If the result is the same as input (e.g., unsolved variable), give a hint
                    if (displayResult === expression) {
                         displayResult = `Expression: ${expression}\n(Note: This solver evaluates numerical expressions. For symbolic algebra like 'solve x+2=5', try entering '5-2'.)`;
                    }

                    showSolution(displayResult);

                } catch (err) {
                    console.error(err);
                    showError("Could not solve. Check syntax (e.g., use 'sqrt(9)' instead of '√9').");
                } finally {
                    setLoading(false);
                }
            }, 600);
        });

        // Handle Clear Button
        clearBtn.addEventListener('click', () => {
            mathInput.value = '';
            imageInput.value = '';
            fileNameDisplay.style.display = 'none';
            fileNameDisplay.textContent = '';
            ocrProgress.style.display = 'none';
            outputArea.style.display = 'none';
            errorMsg.style.display = 'none';
            solutionText.textContent = '';
            mathInput.focus();
        });

        // Handle Copy Button
        copyBtn.addEventListener('click', () => {
            const textToCopy = solutionText.textContent;
            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalText = copyBtn.textContent;
                copyBtn.textContent = "Copied!";
                setTimeout(() => copyBtn.textContent = originalText, 2000);
            }).catch(err => {
                console.error('Failed to copy', err);
            });
        });

        // --- Helper Functions ---

        function setLoading(isLoading) {
            if (isLoading) {
                solveBtn.disabled = true;
                btnText.style.display = 'none';
                spinner.style.display = 'block';
            } else {
                solveBtn.disabled = false;
                btnText.style.display = 'block';
                spinner.style.display = 'none';
            }
        }

        function showError(message) {
            errorMsg.textContent = message;
            errorMsg.style.display = 'block';
        }

        function showSolution(solution) {
            solutionText.textContent = solution;
            outputArea.style.display = 'flex';
            // Scroll to result on mobile
            outputArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

    </script>
</body>
</html>
