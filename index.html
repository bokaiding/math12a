<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Math Solver</title>
    <!-- Load Tesseract.js for OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <!-- Load Math.js for calculation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-primary: #212529;
            --text-secondary: #6c757d;
            --accent: #212529;
            --accent-hover: #495057;
            --error: #dc3545;
            --success: #198754;
            --border: #e9ecef;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            transition: transform 0.2s ease;
        }

        h1 {
            font-weight: 600;
            font-size: 24px;
            margin-bottom: 8px;
            text-align: center;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            color: var(--text-primary);
            background: #fafafa;
            transition: all 0.2s;
            resize: none;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(33, 37, 41, 0.05);
        }

        /* File Upload Styling */
        .file-upload-wrapper {
            position: relative;
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #fafafa;
        }

        .file-upload-wrapper:hover {
            border-color: var(--accent);
            background: #fff;
        }

        .file-upload-wrapper input[type="file"] {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .upload-icon {
            font-size: 24px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .helper-text {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
            font-style: italic;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #fff;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }

        .btn-secondary:hover {
            border-color: var(--text-secondary);
            color: var(--text-primary);
        }

        .btn-copy {
            background-color: #e8f5e9;
            color: var(--success);
            margin-top: 15px;
            width: 100%;
            display: none; /* Hidden by default */
        }
        
        .btn-copy:hover {
            background-color: #c8e6c9;
        }

        /* Results & Loading */
        .result-area {
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid var(--border);
            display: none;
        }

        .result-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .solution-text {
            font-size: 18px;
            font-weight: 500;
            color: var(--text-primary);
            white-space: pre-wrap;
        }

        .loading-spinner {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .error-msg {
            color: var(--error);
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin-top: 10px;
            overflow: hidden;
            display: none;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s;
        }

        /* Preview Image */
        #imagePreview {
            max-width: 100%;
            max-height: 200px;
            margin-top: 15px;
            border-radius: 6px;
            display: none;
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Math Solver</h1>
    <p class="subtitle">Type a problem or upload a photo</p>

    <!-- Text Input -->
    <div class="input-group">
        <label for="mathInput">Problem</label>
        <textarea id="mathInput" rows="3" placeholder="e.g., 2x + 5 = 15 or integrate x^2"></textarea>
    </div>

    <!-- Image Upload -->
    <div class="input-group">
        <label>Upload Image</label>
        <div class="file-upload-wrapper">
            <input type="file" id="imageInput" accept="image/*">
            <div class="upload-icon">📷</div>
            <div style="font-size: 14px;">Click or Drag image here</div>
            <div class="helper-text">For best results, ensure good lighting and write clearly on plain white paper.</div>
        </div>
        <img id="imagePreview" alt="Preview">
        <div class="progress-bar" id="ocrProgress">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div id="ocrStatus" style="font-size: 12px; color: var(--text-secondary); margin-top: 5px; text-align: center;"></div>
    </div>

    <!-- Controls -->
    <div class="btn-group">
        <button class="btn-secondary" id="clearBtn">Clear</button>
        <button class="btn-primary" id="solveBtn">Solve</button>
    </div>

    <!-- Loading State -->
    <div class="loading-spinner" id="loader">
        <div class="spinner"></div>
        <div style="font-size: 13px; color: var(--text-secondary);">Calculating...</div>
    </div>

    <!-- Error Message -->
    <div class="error-msg" id="errorMsg"></div>

    <!-- Result -->
    <div class="result-area" id="resultArea">
        <div class="result-title">Solution</div>
        <div class="solution-text" id="solutionText"></div>
        <button class="btn-copy" id="copyBtn">Copy Solution</button>
    </div>
</div>

<script>
    // DOM Elements
    const mathInput = document.getElementById('mathInput');
    const imageInput = document.getElementById('imageInput');
    const imagePreview = document.getElementById('imagePreview');
    const solveBtn = document.getElementById('solveBtn');
    const clearBtn = document.getElementById('clearBtn');
    const copyBtn = document.getElementById('copyBtn');
    const loader = document.getElementById('loader');
    const resultArea = document.getElementById('resultArea');
    const solutionText = document.getElementById('solutionText');
    const errorMsg = document.getElementById('errorMsg');
    const ocrProgress = document.getElementById('ocrProgress');
    const progressFill = document.getElementById('progressFill');
    const ocrStatus = document.getElementById('ocrStatus');

    // --- Image Pre-processing Logic (Canvas) ---
    // Converts image to grayscale, high contrast, and binary threshold to help OCR
    function preprocessImage(file) {
        return new Promise((resolve) => {
            const img = new Image();
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            img.onload = () => {
                canvas.width = img.width;
                canvas.height = img.height;
                
                // Draw original
                ctx.drawImage(img, 0, 0);
                
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                
                // Process pixels: Grayscale + Binary Threshold
                for (let i = 0; i < data.length; i += 4) {
                    // Convert to grayscale
                    const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
                    
                    // Apply threshold (if dark, make black; if light, make white)
                    // Adjust 140 threshold based on testing, higher = more aggressive cleaning
                    const val = avg < 140 ? 0 : 255; 
                    
                    data[i] = val;     // R
                    data[i + 1] = val; // G
                    data[i + 2] = val; // B
                }
                
                ctx.putImageData(imageData, 0, 0);
                
                // Convert back to blob for Tesseract
                canvas.toBlob((blob) => {
                    resolve(blob);
                }, 'image/png');
            };
            
            img.src = URL.createObjectURL(file);
        });
    }

    // --- OCR Logic with Tesseract.js ---
    async function performOCR(file) {
        try {
            // Show preview
            imagePreview.src = URL.createObjectURL(file);
            imagePreview.style.display = 'block';
            
            ocrProgress.style.display = 'block';
            ocrStatus.textContent = "Pre-processing image...";
            progressFill.style.width = '10%';

            // Pre-process image to improve accuracy
            const processedBlob = await preprocessImage(file);
            
            ocrStatus.textContent = "Reading handwriting...";
            progressFill.style.width = '30%';

            // Initialize Tesseract with specific config for math
            const worker = await Tesseract.createWorker({
                logger: m => {
                    if(m.status === 'recognizing text') {
                        const pct = Math.round(m.progress * 100);
                        progressFill.style.width = `${30 + (pct * 0.7)}%`; // Scale to 100%
                        ocrStatus.textContent = `Scanning: ${pct}%`;
                    }
                }
            });

            await worker.loadLanguage('eng');
            // Whitelist only math-related characters to reduce noise
            await worker.initialize('eng', {
                tessedit_char_whitelist: '0123456789+-*/=().xyznabc^√π'
            });

            const { data: { text, confidence } } = await worker.recognize(processedBlob);
            await worker.terminate();

            ocrStatus.textContent = "Done.";
            progressFill.style.width = '100%';

            // Clean the extracted text
            let cleanedText = cleanOCRText(text);

            if (cleanedText.length < 2 || confidence < 40) {
                showError("Low confidence detection. Please retake photo with better lighting and clearer writing.");
                ocrStatus.textContent = "Failed: Low confidence";
                return;
            }

            mathInput.value = cleanedText;
            hideError();

        } catch (err) {
            console.error(err);
            showError("Error processing image. Please try again.");
            ocrStatus.textContent = "Error";
        }
    }

    // Helper to clean OCR garbage
    function cleanOCRText(text) {
        // Remove newlines and extra spaces
        let clean = text.replace(/\n/g, ' ').replace(/\s+/g, ' ');
        
        // Common OCR fixes
        clean = clean.replace(/\bl\b/g, '1'); // l -> 1
        clean = clean.replace(/\bo\b/g, '0'); // o -> 0
        clean = clean.replace(/×/g, '*');
        clean = clean.replace(/÷/g, '/');
        
        // Remove non-math characters strictly (keep numbers, basic ops, vars)
        // This regex keeps: digits, + - * / ^ . ( ) = space, and common vars x,y,z,n,a,b,c
        clean = clean.replace(/[^0-9+\-*/^().=xyz nabcpisqrt]/gi, '');
        
        return clean.trim();
    }

    // --- Math Solving Logic (Math.js) ---
    function solveMath(expression) {
        try {
            // Evaluate using math.js
            // Note: For step-by-step, math.js gives the result. 
            // True symbolic step-by-step requires a backend CAS, but we can format the output nicely.
            const node = math.parse(expression);
            const result = node.evaluate();
            
            // Format result
            let formattedResult = "";
            
            if (typeof result === 'number') {
                formattedResult = `= ${math.format(result, {precision: 14})}`;
            } else if (result && typeof result === 'object') {
                 formattedResult = `= ${result.toString()}`;
            } else {
                formattedResult = expression; // Fallback
            }

            // Construct a "Step-by-step" mock for simple algebra if possible, 
            // otherwise just show the evaluation.
            // Since we don't have a CAS backend, we show the parsed tree as steps for demonstration
            // or just the final result clearly.
            
            return `Input: ${expression}\n\nResult:\n${formattedResult}`;
        } catch (err) {
            throw new Error("Invalid mathematical expression.");
        }
    }

    // --- Event Listeners ---

    imageInput.addEventListener('change', (e) => {
        if (e.target.files[0]) {
            performOCR(e.target.files[0]);
        }
    });

    solveBtn.addEventListener('click', () => {
        const query = mathInput.value.trim();
        if (!query) {
            showError("Please enter a problem or upload an image.");
            return;
        }

        // UI State: Loading
        loader.style.display = 'block';
        resultArea.style.display = 'none';
        copyBtn.style.display = 'none';
        hideError();

        // Simulate slight delay for UX
        setTimeout(() => {
            try {
                const solution = solveMath(query);
                solutionText.textContent = solution;
                
                loader.style.display = 'none';
                resultArea.style.display = 'block';
                copyBtn.style.display = 'block';
            } catch (err) {
                loader.style.display = 'none';
                showError(err.message || "Could not solve this problem.");
            }
        }, 600);
    });

    clearBtn.addEventListener('click', () => {
        mathInput.value = '';
        imageInput.value = '';
        imagePreview.style.display = 'none';
        imagePreview.src = '';
        resultArea.style.display = 'none';
        ocrProgress.style.display = 'none';
        ocrStatus.textContent = '';
        progressFill.style.width = '0%';
        hideError();
    });

    copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(solutionText.textContent).then(() => {
            const originalText = copyBtn.textContent;
            copyBtn.textContent = "Copied!";
            setTimeout(() => copyBtn.textContent = originalText, 2000);
        });
    });

    function showError(msg) {
        errorMsg.textContent = msg;
        errorMsg.style.display = 'block';
    }

    function hideError() {
        errorMsg.style.display = 'none';
    }
</script>

</body>
</html>
